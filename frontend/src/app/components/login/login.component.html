<!-- Pantalla de Bienvenida Animada (Primera visita de la sesión) -->
<app-splash-intro
  *ngIf="showIntro()"
  (completed)="onIntroCompleted()">
</app-splash-intro>

<!-- Contenedor Principal Centrado sobre Verde Abeto (#143628) -->
<div class="min-h-screen w-full flex flex-col items-center justify-center p-4 bg-[#143628] relative overflow-hidden font-sans antialiased">

  <!-- Contenedor Animado de Entrada -->
  <div
    class="relative z-10 w-full max-w-[420px]"
    [class.animate-card-enter]="!showIntro()"
    [class.opacity-0]="showIntro()">

    <!-- Tarjeta Blanca Central -->
    <div
      [class.animate-shake]="shakeCard()"
      class="relative overflow-hidden bg-white rounded-lg shadow-xs w-full p-8 sm:p-9 border border-[#E7E0D3] transition-colors duration-200">

      <!-- Barra de Carga Superior -->
      <div *ngIf="isLoading()" class="absolute top-0 inset-x-0 h-1 bg-[#F5EFE6] overflow-hidden z-20">
        <div class="h-full bg-[#E0432D] animate-indeterminate-bar"></div>
      </div>

      <!-- Cabecera Centrada -->
      <div class="flex flex-col items-center text-center mb-6">
        <div
          [class.animate-pulse]="isLoading()"
          class="w-16 h-16 rounded-lg bg-[#FBF8F3] border border-[#E7E0D3] p-2 flex items-center justify-center mb-4 transition-transform duration-300">
          <img
            alt="Candy Boom"
            class="w-full h-full object-contain"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUqPzqsm7tJ63hm4gjhQrAFgglvGWhuuSIO9uFPP61bqkJVavDaLVnNMwGvJvp_podWd28SCe7SiXSnpzTcfrEVwrnn5EaooYgbuNpscxo2VrjQ-VRuXzSCE6m2tmOKFc_O0XKE3dGyyIKBtPTVjFqu4pkwEErUAGJXT7rMKarAA_yUN_1_y4aqKGfxCh1yJwmAguWdTpt-n6-ZWRox0gHVjl5q7rdsP5pfLySiMNQ" />
        </div>
        <h1 class="text-xl font-bold text-[#12261E] tracking-tight">Iniciar Sesión</h1>
        <p class="text-xs text-[#52665D] font-medium mt-1">Gestión Comercial · Sucre, Bolivia</p>
      </div>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMessage()" class="mb-4 p-3 rounded-md bg-red-50 border border-[#DC2626] flex items-start gap-2.5">
        <svg class="w-4 h-4 text-[#DC2626] shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p class="text-xs text-[#DC2626] font-semibold leading-relaxed flex-1">{{ errorMessage() }}</p>
        <button type="button" (click)="errorMessage.set(null)" class="text-[#DC2626]/70 hover:text-[#DC2626] cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="space-y-4 transition-opacity duration-200" [class.opacity-70]="isLoading() || isSuccess()">
          <!-- Campo Usuario o Correo -->
          <div class="space-y-1">
            <label class="block text-xs font-semibold text-[#12261E]" for="loginEmail">
              Usuario o Correo
            </label>
            <div class="relative flex items-center">
              <div class="absolute left-3 pointer-events-none text-[#52665D] flex items-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </div>
              <input
                id="loginEmail"
                type="email"
                formControlName="email"
                autocomplete="username"
                placeholder="correo@candyboom.bo"
                class="w-full h-10 pl-9 pr-3 bg-[#FBF8F3] focus:bg-white text-[#12261E] placeholder:text-[#52665D]/60 text-sm font-medium rounded-md border border-[#E7E0D3] outline-none transition-colors focus:border-[#E0432D] disabled:cursor-not-allowed"
                [class.border-[#DC2626]]="(loginForm.get('email')?.invalid && loginForm.get('email')?.touched) || errorMessage()" />
            </div>
            <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-[11px] text-[#DC2626] font-medium">
              Ingresa un correo electrónico válido.
            </p>
          </div>

          <!-- Campo Contraseña -->
          <div class="space-y-1">
            <label class="block text-xs font-semibold text-[#12261E]" for="loginPassword">
              Contraseña
            </label>
            <div class="relative flex items-center">
              <div class="absolute left-3 pointer-events-none text-[#52665D] flex items-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <input
                id="loginPassword"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full h-10 pl-9 pr-10 bg-[#FBF8F3] focus:bg-white text-[#12261E] placeholder:text-[#52665D]/60 text-sm font-medium rounded-md border border-[#E7E0D3] outline-none transition-colors focus:border-[#E0432D] disabled:cursor-not-allowed"
                [class.border-[#DC2626]]="(loginForm.get('password')?.invalid && loginForm.get('password')?.touched) || errorMessage()" />

              <!-- Botón Mostrar / Ocultar Contraseña -->
              <button
                type="button"
                [disabled]="isLoading() || isSuccess()"
                (click)="togglePasswordVisibility()"
                aria-label="Mostrar u ocultar contraseña"
                class="absolute right-2 p-1.5 rounded text-[#52665D] hover:text-[#12261E] hover:bg-[#F5EFE6] transition-colors cursor-pointer disabled:pointer-events-none">
                <svg *ngIf="!showPassword()" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showPassword()" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              </button>
            </div>
            <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-[11px] text-[#DC2626] font-medium">
              La contraseña debe tener al menos 6 caracteres.
            </p>
          </div>

          <!-- Casilla Simple -->
          <div class="pt-0.5">
            <label class="inline-flex items-center gap-2 cursor-pointer select-none">
              <input
                type="checkbox"
                formControlName="remember"
                class="w-4 h-4 rounded border-[#E7E0D3] text-[#E0432D] focus:ring-[#E0432D] accent-[#E0432D] cursor-pointer disabled:cursor-not-allowed" />
              <span class="text-xs text-[#52665D] font-medium">Recordar mi sesión en este equipo</span>
            </label>
          </div>
        </div>

        <!-- Botón Principal -->
        <div class="pt-1">
          <button
            type="submit"
            [disabled]="isLoading() || isSuccess()"
            [ngClass]="isSuccess()
              ? 'bg-[#15803D] cursor-default'
              : isLoading()
                ? 'bg-[#E0432D] opacity-90 cursor-wait'
                : 'bg-[#E0432D] hover:bg-[#C43420] active:scale-[0.99] cursor-pointer'"
            class="w-full h-10 rounded-md text-white font-semibold text-sm transition-colors duration-200 flex items-center justify-center gap-2">

            <ng-container *ngIf="isLoading()">
              <svg class="w-4 h-4 animate-spin text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              <span>Verificando credenciales...</span>
            </ng-container>

            <ng-container *ngIf="isSuccess()">
              <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span>Acceso concedido</span>
            </ng-container>

            <ng-container *ngIf="!isLoading() && !isSuccess()">
              <span>Ingresar al Sistema</span>
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
              </svg>
            </ng-container>
          </button>
        </div>

      </form>

      <!-- Pie de tarjeta discreto -->
      <div class="mt-5 pt-4 border-t border-[#E7E0D3] text-center">
        <button
          type="button"
          (click)="showSupportNotice()"
          class="text-xs text-[#52665D] hover:text-[#12261E] transition-colors cursor-pointer">
          ¿Problemas de acceso? Contacta a Gerencia
        </button>
      </div>

    </div>
  </div>

  <!-- Pie fuera de la tarjeta -->
  <p class="relative z-10 mt-5 text-xs text-[#FBF8F3]/75 font-medium tracking-wide text-center">
    Candy Boom · Sucre, Bolivia
  </p>

  <!-- Toast de Notificación -->
  <div
    *ngIf="toastMessage()"
    class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-md shadow-xs flex items-center gap-2 bg-[#143628] text-[#FBF8F3] text-xs font-medium border border-[#1E4D3B]">
    <svg class="w-4 h-4 text-[#E0432D] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <span>{{ toastMessage()?.text }}</span>
  </div>

</div>
